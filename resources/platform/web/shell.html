<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LVUI</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="LVUI application" data-iigui-accessibility></canvas>
  <script>
    var Module = { canvas: document.getElementById('canvas') };
    Module.canvas.addEventListener('pointerdown', function () {
      Module.canvas.focus({preventScroll: true});
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
